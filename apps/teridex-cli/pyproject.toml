[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teridex-cli"
version = "0.1.0"
description = "Teridex command-line entry point"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "teridex-core",
    "teridex-adapters[all]",
    "teridex-engine",
    "teridex-plugins",
    "teridex-tui",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
teridex = "teridex_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teridex_cli"]

[tool.uv.sources]
teridex-core = { workspace = true }
teridex-adapters = { workspace = true }
teridex-engine = { workspace = true }
teridex-plugins = { workspace = true }
teridex-tui = { workspace = true }
