target-version = "py313"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL",
    "N", "C4", "PIE", "PT", "RET", "TID", "TCH", "PTH",
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value
    "PLR0915",  # too many statements
    "PLR0912",  # too many branches
    "PLR0911",  # too many returns
]

[lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PT011"]
"**/__init__.py" = ["F401"]

[lint.isort]
known-first-party = [
    "teridex_core",
    "teridex_engine",
    "teridex_adapters",
    "teridex_plugins",
    "teridex_cli",
    "teridex_tui",
]

[format]
docstring-code-format = true
