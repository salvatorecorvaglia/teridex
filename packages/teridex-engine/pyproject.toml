[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teridex-engine"
version = "0.1.0"
description = "Teridex query engine: async execution, streaming, history, pool"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "teridex-core",
    "aiosqlite>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teridex_engine"]

[tool.uv.sources]
teridex-core = { workspace = true }
