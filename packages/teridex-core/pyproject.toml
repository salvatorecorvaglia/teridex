[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teridex-core"
version = "0.1.0"
description = "Teridex core: domain models, DI, events, config, logging, errors"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Teridex contributors" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typing-extensions>=4.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teridex_core"]
