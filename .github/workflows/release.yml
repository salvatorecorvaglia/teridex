name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ── checkout & toolchain ──────────────────────────────────────────
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # ── test gate ─────────────────────────────────────────────────────
      - name: Sync workspace
        run: uv sync --all-extras --all-packages --dev --frozen

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test
        run: ./scripts/test.sh

      # ── Build Packages ────────────────────────────────────────────────
      - name: Build packages
        run: uv build --all-packages --out-dir dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      # ── GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true

