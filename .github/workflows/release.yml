name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ── checkout & toolchain ──────────────────────────────────────────
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # ── test gate ─────────────────────────────────────────────────────
      - name: Sync workspace
        run: uv sync --all-extras --all-packages --dev --frozen

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test
        run: ./scripts/test.sh

      # ── GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # ── Update Homebrew tap ───────────────────────────────────────────
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "::group::Compute SHA-256"
          SHA256=$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | cut -d ' ' -f 1)
          echo "sha256=${SHA256}"
          echo "::endgroup::"

          echo "::group::Clone tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/salvatorecorvaglia/homebrew-teridex.git" tap
          echo "::endgroup::"

          cd tap

          # Update url + sha256 in the formula
          sed -i "s|url \"https://github.com/salvatorecorvaglia/teridex/archive/.*\"|url \"${TARBALL_URL}\"|" formula/teridex.rb
          sed -i "s|sha256 \"[a-fA-F0-9]*\"|sha256 \"${SHA256}\"|"                                        formula/teridex.rb

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add formula/teridex.rb

          # Only push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "teridex ${VERSION}"
            git push
            echo "✅ Tap updated to ${VERSION} (sha256: ${SHA256})"
          else
            echo "ℹ️  formula already up to date"
          fi
