name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --all-extras --all-packages --dev --frozen

      - name: Lint (ruff format + check + mypy)
        run: ./scripts/lint.sh

      - name: Test (pytest + coverage gate)
        run: ./scripts/test.sh
