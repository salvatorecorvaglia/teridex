name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "lint"
          python-version: "3.13"

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      - name: Lint (ruff format + check + mypy)
        run: ./scripts/lint.sh

  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: "test"
          python-version: "3.13"

      - name: Sync workspace
        run: uv sync --all-extras --dev --frozen

      # On ubuntu the runner has a Docker daemon, so the Postgres/MySQL
      # conformance fixtures start real containers. On macOS there is no
      # daemon, so those tests are excluded rather than silently skipped.
      - name: Test (pytest + coverage gate)
        run: ./tests/scripts/test.sh
        env:
          TERIDEX_TEST_MARKERS: ${{ matrix.os == 'ubuntu-latest' && 'integration or not integration' || 'not integration' }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The image is a shipped artifact; building it here stops it rotting
      # unnoticed, which is how it came to reference apt-get on an Alpine base.
      - name: Build image
        run: docker build -f docker/Dockerfile -t teridex:ci .

      - name: Smoke-test the image
        run: docker run --rm teridex:ci version
